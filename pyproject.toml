[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "First-principles GPT-2 implementation in raw PyTorch tensor operations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
